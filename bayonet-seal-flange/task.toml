[task]
name = "afterquery/bayonet-seal-flange"

[metadata]
author_name = "Yasharth Singh"
author_email = "yasharthsingh1777@gmail.com"
difficulty_explanation = """This is work a mechanical designer who releases instrument housings and optical mounts would be paid to do: two parts that have to assemble, seal, clock, and lock, then go to a shop as STL. A focused expert spends the better part of a day getting the twist and the seals right.

Humans fail the 3-D kinematics. They space the lugs 120° apart (this set is 0/107/236 with three widths), they seat the faces and then rotate (the spec requires a 1.10 mm pull-in while turning 47° CCW), they put a round hole where the clock pin has to travel, or they forget that the leak-test holes only line up after that 47° offset. Clockwise does not insert. They also run the lug race through to z=10 and split the receiver off the back step, or they leave the windows as pockets that start at z=3 so the lugs cannot enter.

Agents fail the same ways, and also put the groove on the male, run the barrel through the back wall, omit the mill-vice flat, or export the cap already twisted to lock. Size and volume of a pair of tubes is not enough — the grader transforms the male through insert, lock, wrong clock, and CW and checks metal vs air."""
solution_explanation = """The reference is not a CAD GUI model. Each half is an implicit solid: a Python function that returns true when a point is metal. The female function starts as a stepped disk, then subtracts the bore, a race that stops at z=9.40 (a web keeps the Ø50 back step attached), three face-through windows, both grooves, bolt holes, clock slot, weep, and vice flat, and adds lip height after each window's CCW edge (that extra height is the 1.10 mm / 47° ramp) plus the race stop. The male function is the cap, barrel, three lugs, clock pin, optic pocket, and weep, all in the insert pose so a +47° rotation is the lock.

Those functions are sampled on a 0.25 mm grid. Faces between solid and empty cells become a binary STL. 0.25 mm is coarse enough to run in seconds and fine enough that the verifier's probe points sit well inside or outside a surface. Alternative CAD that hits the same metal/air at those points also passes."""
verification_explanation = """The verifier never runs agent code. It parses the two STLs (binary, or the usual ASCII facet text) and classifies probe points with majority ray-parity: five rays with micron jitter, odd crossings count as inside. Volume is the closed-mesh tet sum.

Oracle volumes on this voxel grid sit near 19000 mm³ (female) and 30100 mm³ (male). Pass bands 16500–22500 and 27000–34000 are those numbers with slack for 0.2 mm edge breaks, a smoother CAD tessellation, or ±0.3 mm on non-critical walls. A solid brick or a thin tube falls outside. Bounding boxes are the ICD envelopes plus about 1.5 mm.

Gland probes sit on a solid sector (~160°), not on a window centreline — a face-through window (required for insert) has no land at 0°. Other functional probes sit ≥0.4 mm inside features (lug cores, window air, ramp metal, slot travel, weep) so a change of mesh resolution cannot flip them. Transformed male points check insert at dz=-1.10 (no clash), lock at +47° (lip blocks pull-out, weeps coincide), +107° clock (fat lug jams), and CW (also jammed). Ground-truth coordinates live only in tests/. A 120° clone or two tubes fails that set."""
category = "Hardware"
subcategory = "CAD"
tags = ["cad", "stl", "bayonet", "o-ring", "mechanical-interface"]
expert_time_estimate_hours = 12
relevant_experience = "Instrument housings and optical-mechanical ICDs: bayonet receivers, face-seal glands, bolt circles, and shop handoff of mating STL pairs."

