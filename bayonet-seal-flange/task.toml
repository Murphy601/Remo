artifacts = ["/app/female.stl", "/app/male.stl"]

[task]
name = "afterquery/bayonet-seal-flange"

[metadata]
author_name = "David Muiruri"
author_email = "andreancarols@gmail.com"
difficulty_explanation = "This is a mating pair, not a single body from a drawing. The agent has to hold one frame, a keyed insert pose, a 50° CCW lock, a face gland, a bolt circle with spotfaces, a race-and-lip bayonet, a hard stop, and a back-wall step at once. The usual failure is three equal lugs (it inserts in three poses), lock the wrong way, run the barrel through the Ø50 seat, or put the groove on the male. Volume and bounding box of a tube will not pass — the grader samples the lip, the race, the gland, the stop, and transformed male points at insert, mid-stroke, lock, and the blocked clock."
solution_explanation = "Build the female as a Ø72 flange with a Ø50 × 2 mm back wall, subtract the Ø48.30 barrel bore, the Ø56.40 race, three unequally wide lip windows, the HX-7 rectangular gland, and four spotfaced M3 holes, then add the 72–80° race stop. Build the male as a Ø64 cap, Ø48 barrel that stops at z = 9.50, a Ø36.50 optic pocket, and one 38° key lug plus two 26° lugs. Export both as binary STL in millimetres."
verification_explanation = "The verifier loads the two binary STLs and ray-casts a sealed probe set. It checks envelopes and volumes, empty optical bore, female gland trough, M3 plus spotface, back-wall step, key-lug vs regular-lug metal, insert clearance at 0°, pull-out block at +50°, hard stop, and that a +120° clock jams the fat lug in a thin window. Ground-truth points live only in tests/. A pair of tubes with the right bbox fails the lip/lug/gland probes."
category = "Hardware"
subcategory = "CAD"
tags = ["cad", "openscad", "bayonet", "o-ring", "mechanical-interface"]
expert_time_estimate_hours = 6
relevant_experience = "Instrument housings and optical-mechanical ICDs: bayonet receivers, face-seal glands, bolt circles, and shop handoff of mating STL pairs."

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[agent]
timeout_sec = 14400.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
