artifacts = ["/app/mesi_pair.v"]

[task]
name = "afterquery/snoop-mesi-l1"

[metadata]
author_name = "Yasharth Singh"
author_email = "yasharthsingh1777@gmail.com"
difficulty_explanation = "Two direct-mapped 4-line L1s share one 8-cycle memory. Hits are easy. The work is MESI: BusRd of a Modified line needs a writeback or a cache-to-cache copy and both go Shared; a store to Shared needs an invalidate of the sibling; evicting dirty data is four word writes or you lose it. A core that treats memory as a dual-port RAM gets the data right and still blows the cycle cap. False sharing (same line, different words) and ping-pong stores catch silent drops of snoop."
solution_explanation = "Per-core tag/state/data arrays (I/S/E/M). A core answers a hit in one cycle when the state allows the op. Misses take a single shared bus FSM: writeback a Modified victim or sibling, copy from the sibling when it has the line, otherwise issue four mem reads. Stores that hit S upgrade by invalidating the other cache. Round-robin if both cores miss. Responses sit on c*_rvalid until rready."
verification_explanation = """C++ Verilator scoreboard (tb_coh.cpp) is both CPU masters and the 8-cycle word memory. A case passes only if (1) every completed read matches a last-write-wins image of that word (writes from either core, same-core order), (2) sent == done == the scripted op count for that case (no dropped or ghost responses), and (3) cycles used is strictly below a per-case bound. The eight bounds in test_coh.py are 300, 250, 900, 750, 1100, 280, 750, 320 for c0_hits, cross_read, false_share, ping_pong, evict_dirty, split_lines, hold_rsp, late_rst. They were set from one run of this reference: 213, 135, 633, 520, 786, 152, 524, 189 cycles. That leaves 29-46% of each bound unused (smallest on c0_hits/evict_dirty at ~29%, largest on cross_read/split_lines at ~46%), which is the slack for a correct MESI pair that is slower than this one -- extra hit latency, a fully serialized bus, writeback on BusRdX, no cache-to-cache copy. The bounds are not tight to the oracle. They do sit under a no-cache passthrough on the hit-heavy case (c0_hits: passthrough 686 > 300; reference 213). pytest reads a COH line on fd 10 (not stdout): COH <ok> <sent> <done> <cyc> <mac>. The mac is HMAC-SHA256 of that four-integer body with a 32-byte nonce from fd 9, not a plain SHA-256 of nonce||body. Stdout is discarded; spawn is linker-wrapped; the sim is setpriv'd to uid 65534; /tests is 700 while it runs."""
category = "Hardware"
subcategory = "RTL"
tags = ["verilog", "mesi", "cache-coherence", "snoopy-bus", "l1-cache"]
expert_time_estimate_hours = 8
relevant_experience = "CPU cache design: MESI snooping, writeback, false sharing, and a cycle-accurate coherence checker."

