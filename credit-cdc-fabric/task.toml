[task]
name = "afterquery/credit-cdc-fabric"

[metadata]
author_name = "Yasharth Singh"
author_email = "yasharthsingh1777@gmail.com"
difficulty_explanation = "The hard part is not wiring an async FIFO. It is keeping the credit loop honest when clk_b is 7x clk_a (consecutive cr_ret pulses must not collapse into one p_credit) and when clk_a is 5x clk_b (the write side bursts into a slow pop). A one-shot toggle synchronizer on cr_ret looks fine at 1:1 and dies on the ratio sweep. Same for a combo bypass that only works when the edges line up. Getting occupancy, valid/ready hold, and packet SOP/EOP through that loop without deadlock under delayed credit return is regular interconnect bring-up work, not a textbook copy-paste."
solution_explanation = "FWFT dual-clock FIFO (Gray write/read pointers, depth 8) for the beat path. Credit returns are a wrapping count in clk_b, Gray-synced into clk_a, then turned into one p_credit pulse per increment. A small pending counter on clk_a serializes a burst of clk_b returns so none are lost when Fa:Fb = 1:7. No extra credits, no combo forward between the two clocks."
verification_explanation = "A C++ Verilator harness (not a Verilog TB compiled with the DUT) drives the frozen pins and scoreboards every beat. Stdout/stderr are discarded. The parent hands a 32-byte secret on fd 7; the harness writes GRADE plus SHA-256(secret||counts) on fd 8, so $display RESULT PASS or a forged GRADE line cannot score. system/fork/exec are linker-wrapped to EPERM. The sim is setpriv'd to uid 65534 with no caps; /tests and /logs/verifier are 700 root before the DUT runs. Process groups are killed on timeout. Same ratio/phase/reset/traffic sweep as the instruction: lossless in-order delivery and matching credit counts."
category = "Hardware"
subcategory = "RTL"
tags = ["verilog", "cdc", "credit-flow-control", "async-fifo", "packet-fabric"]
expert_time_estimate_hours = 6
relevant_experience = "FPGA/ASIC interconnect bring-up: dual-clock packet links, credit-based flow control, Gray-pointer FIFOs, and Verilator/Icarus scoreboards for multi-ratio CDC."

