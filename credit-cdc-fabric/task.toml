[task]
name = "afterquery/credit-cdc-fabric"

[metadata]
author_name = "Yasharth Singh"
author_email = "yasharthsingh1777@gmail.com"
difficulty_explanation = "A single Gray FIFO is not enough. Two producers may valid on the same clk_a cycle, so a 1-write-port mux drops a beat. Output is wormhole: lock to a VC until EOP, but between packets the consumer's c_allow mask can be stuck on the other VC for dozens of cycles — presenting the nonempty-but-disallowed VC deadlocks. Credits are per-VC counts of 0-2 per clk_b, not a 1-bit pulse; collapsing a 2 into one p_credit or crossing VC pools dies on the 1:7 packed-return config. Occupancy is 4 in flight per VC, so there is no slack for a leaked token."
solution_explanation = "Separate FWFT dual-clock FIFOs per VC (Gray pointers, depth 8) with a wormhole arbiter on clk_b: lock on SOP, clear on EOP, idle pick among nonempty VCs that are in c_allow, round-robin when both are legal. Credit returns of 1 or 2 are pushed as a 2-bit token into a second async FIFO per VC and serialized to one p_credit pulse per clk_a. No combo path between clocks."
verification_explanation = "A C++ Verilator harness (not a Verilog TB compiled with the DUT) drives both producers, the allow mask, and packed credit counts, and scoreboards each VC separately. Stdout/stderr are discarded. The parent hands a 32-byte secret on fd 7; the harness writes GRADE plus SHA-256(secret||counts) on fd 8. system/fork/exec are linker-wrapped to EPERM. The sim is setpriv'd to uid 65534; /tests is 700 root; /logs/verifier is 700 while the DUT runs. Same ratio/phase/reset/traffic/allow sweep as the instruction."
category = "Hardware"
subcategory = "RTL"
tags = ["verilog", "cdc", "credit-flow-control", "async-fifo", "virtual-channel", "wormhole"]
expert_time_estimate_hours = 8
relevant_experience = "FPGA/ASIC interconnect bring-up: dual-clock virtual-channel links, wormhole switching, credit-based flow control, Gray-pointer FIFOs, and Verilator scoreboards for multi-ratio CDC."

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

